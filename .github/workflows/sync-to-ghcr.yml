name: 同步 Release 镜像到 GHCR

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 Release tag（留空则取最新 Release）'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 确定 Release tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将同步 Release: $TAG"

      - name: 下载 Release 中的镜像 tar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'threekindoms-hd2d-*.tar' \
            --dir "$RUNNER_TEMP/image" \
            --clobber
          ls -lh "$RUNNER_TEMP/image"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 载入镜像并推送
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          TAR=$(find "$RUNNER_TEMP/image" -name 'threekindoms-hd2d-*.tar' | head -n1)
          if [ -z "$TAR" ]; then
            echo "没有找到镜像 tar 包"; exit 1
          fi
          echo "镜像包: $TAR"

          # docker load 会输出 "Loaded image: xxx:yyy" 或 "Loaded image ID: sha256:..."
          LOAD_OUT=$(docker load -i "$TAR")
          echo "$LOAD_OUT"

          REF=$(printf '%s\n' "$LOAD_OUT" | sed -n 's/^Loaded image: //p' | head -n1)
          if [ -z "$REF" ]; then
            REF=$(printf '%s\n' "$LOAD_OUT" | sed -n 's/^Loaded image ID: //p' | head -n1)
          fi
          if [ -z "$REF" ]; then
            echo "无法从 docker load 输出中识别镜像，请检查 tar 包"; exit 1
          fi

          TARGET="ghcr.io/${OWNER}/threekindoms-hd2d"
          docker tag "$REF" "$TARGET:$TAG"
          docker push "$TARGET:$TAG"
          echo "已推送 $TARGET:$TAG"

          # 只有当前 Release 确实是最新 Release 时，才更新 latest 标签
          LATEST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$TAG" = "$LATEST_TAG" ]; then
            docker tag "$REF" "$TARGET:latest"
            docker push "$TARGET:latest"
            echo "已更新 $TARGET:latest"
          fi
